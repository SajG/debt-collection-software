name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

# Gitleaks scans the entire tree on push to main and the PR diff on
# every PR. A recognised key shape (Supabase JWT, AWS access key,
# GCP service account, generic high-entropy string tagged by a
# known env-var name like `SUPABASE_SERVICE_ROLE_KEY=`) fails the
# workflow. Custom patterns live in .gitleaks.toml at the repo root.
#
# When gitleaks flags a false positive, add a `[[allowlist.regex]]`
# in .gitleaks.toml with a comment explaining why — do NOT silence
# by removing this workflow.

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so PR-diff mode has both sides to diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Free, no license needed for public repos or private repos
          # scanning their own code. If the repo goes GH Enterprise
          # with SBOM scan features, swap for the licenced action.
          GITLEAKS_LICENSE: ""
        with:
          # Fail the job on any leak (default is exit 0 with report).
          fail: "true"
